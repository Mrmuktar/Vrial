services:
  - type: web
    name: bangla-viral-bot
    runtime: python
    plan: starter            # free প্ল্যানে ডিস্ক ও সবসময়-চালু থাকা নেই; শুধু টেস্টের জন্য
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /api/config
    disk:
      name: botdata
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DB_PATH
        value: /data/data.db
      - key: MENU_BUTTON_TEXT
        value: Viral Zone
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
